<!DOCTYPE html>
<html>
	<head>
		<style>
			:root {
				--card-padding: clamp(10px, 1.4vw, 16px);
				--label-size: clamp(1rem, 0.8vw + 0.7rem, 1.4rem);
				--body-size: clamp(1.1rem, 1vw + 0.75rem, 1.8rem);
				--title-size: clamp(1.2rem, 1.2vw + 0.8rem, 2rem);
			}
			body {
				font-family: Arial, sans-serif;
				margin: 0;
				padding: var(--card-padding);
				box-sizing: border-box;
				overflow: hidden;
				position: relative;
				height: 100vh;
				display: flex;
				align-items: stretch;
				justify-content: center;
			}
			.card-body {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: flex-start;
				width: 100%;
				max-width: 90%;
				height: 100%;
				box-sizing: border-box;
				padding-top: 8px;
			}
			#mainTitle {
				display: none;
			}
			.content-stack {
				flex: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: clamp(12px, 1.8vw, 18px);
				width: 100%;
			}
			.row {
				display: flex;
				align-items: center;
				width: min(100%, 90%);
				gap: clamp(8px, 1vw, 12px);
			}
			.label {
				font-weight: 700;
				font-size: var(--label-size);
				min-width: clamp(80px, 12vw, 100px);
				text-align: left;
			}
			.value {
				font-size: var(--body-size);
				flex: 1;
				text-align: left;
				word-break: break-word;
			}
			select, input {
				font-size: var(--body-size);
				width: 100%;
				height: clamp(34px, 3.6vw, 42px);
				box-sizing: border-box;
			}
			#statusResult {
				font-weight: bold;
			}
			#timestamp {
				position: absolute;
				bottom: 4px;
				left: 0;
				right: 0;
				text-align: center;
				font-size: clamp(8px, 1vw, 10px);
				color: #555;
			}
			#analyticsNote {
				position: absolute;
				bottom: 20px;
				left: 0;
				right: 0;
				text-align: center;
				font-size: clamp(8px, 1vw, 10px);
				color: #555;
			}
			@media (max-width: 480px) {
				body {
					padding: 8px;
				}
				.card-body {
					max-width: 100%;
					padding-top: 6px;
				}
				.content-stack {
					gap: 10px;
				}
				.row {
					flex-direction: column;
					align-items: flex-start;
					width: 100%;
				}
				.label {
					min-width: 0;
					font-size: 1rem;
				}
				.value,
				select,
				input {
					font-size: 1.1rem;
				}
			}
		</style>
	</head>
	<body>
		<div class='card-body'>
			<p id='mainTitle'>Minecraft Server Status</p>
			<div class='content-stack'>
				<div class='row'>
					<div class='label'>Server:</div>
					<input id='serverSelect' list='serverOptions' placeholder='Type or choose a server' onchange='checkServerStatus();'>
					<datalist id='serverOptions'>
						<option value='play.hypixel.net'>Hypixel</option>
						<option value='play.cubecraft.net'>CubeCraft</option>
						<option value='us.mineplex.com'>Mineplex</option>
					</datalist>
				</div>
				<div class='row'>
					<div class='label'>Status:</div>
					<div class='value' id='statusResult'>Checking...</div>
				</div>
				<div class='row'>
					<div class='label'>Players:</div>
					<div class='value' id='playersResult'>--</div>
				</div>
			</div>
		</div>
		<div id='analyticsNote'>Google Analytics Enabled</div>
		<div id='timestamp'></div>

		<script>
			function updateTimestamp() {
				var timestamp = document.getElementById('timestamp');
				var now = new Date();
				timestamp.textContent = 'Updated: ' + now.toLocaleString();
				console.log('Timestamp updated:', { time: now.toISOString(), displayText: timestamp.textContent });
			}

			function checkServerStatus() {
				var server = document.getElementById('serverSelect').value.trim();
				var resultBox = document.getElementById('statusResult');
				var playersBox = document.getElementById('playersResult');

				console.log('Starting status check:', { server: server, statusText: resultBox.textContent });

				if (!server) {
					alert('Please type a server name before checking status.');
					resultBox.textContent = 'No server entered';
					resultBox.style.color = '#666';
					playersBox.textContent = '--';
					console.log('Blank server input caught:', { server: server });
					return;
				}

				if (/^[0-9+\-*/().\s]+$/.test(server)) {
					alert('Please enter a server name, not a math expression.');
					resultBox.textContent = 'Invalid expression';
					resultBox.style.color = '#b22222';
					playersBox.textContent = '--';
					console.log('Math expression input caught:', { server: server });
					return;
				}

				if (/[^a-zA-Z0-9.-]/.test(server)) {
					alert('Only letters, numbers, periods, and dashes are supported for server names.');
					resultBox.textContent = 'Unsupported characters';
					resultBox.style.color = '#b22222';
					playersBox.textContent = '--';
					console.log('Unsupported character input caught:', { server: server });
					return;
				}

				if (!server.includes('.') || server.split('.').some(function(part) { return part.length < 1; })) {
					alert('Please enter a valid server hostname, such as play.hypixel.net.');
					resultBox.textContent = 'Invalid server name';
					resultBox.style.color = '#b22222';
					playersBox.textContent = '--';
					console.log('Hostname format input caught:', { server: server });
					return;
				}

				resultBox.textContent = 'Checking...';
				resultBox.style.color = '#666';
				playersBox.textContent = '--';

				debugger;

				fetch('https://api.mcsrvstat.us/3/' + encodeURIComponent(server))
					.then(function(response) {
						return response.json();
					})
					.then(function(data) {
						var online = data && data.players && data.players.online ? data.players.online : 0;
						var max = data && data.players && data.players.max ? data.players.max : 0;

						debugger;
						console.log('Received API response:', { server: server, data: data, online: data && data.online, onlinePlayers: online, maxPlayers: max });

						if (data && data.online) {
							resultBox.textContent = 'Online';
							resultBox.style.color = 'green';
							playersBox.textContent = online + ' / ' + max;
						} else {
							resultBox.textContent = 'Offline';
							resultBox.style.color = 'red';
							playersBox.textContent = '0 / 0';
						}

						debugger;
						console.log('Rendered card values:', { server: server, status: resultBox.textContent, players: playersBox.textContent, color: resultBox.style.color });
						updateTimestamp();
					});
			}

			if (document.getElementById('serverSelect').value.trim() !== '') {
				checkServerStatus();
			}
		</script>
	</body>
</html>
